{% extends "base.html" %}
{% block title %}Login - Smart Garage Locator{% endblock %}
{% block fullcontent %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg,#1a73e8,#0d47a1);">
    <div class="card p-4" style="width:100%;max-width:430px;">
        <div class="text-center mb-4">
            <div class="display-4 mb-2">🔧</div>
            <h3 class="fw-bold text-primary">Smart Garage Locator</h3>
            <p class="text-muted small">Sign in to your account</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="remember" class="form-check-input" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                <i class="fas fa-sign-in-alt me-2"></i>Sign In
            </button>
        </form>
        <hr>
        <div class="text-center">
            <span class="text-muted small">Don't have an account?</span>
            <a href="{{ url_for('auth.register') }}" class="ms-1 fw-semibold">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
