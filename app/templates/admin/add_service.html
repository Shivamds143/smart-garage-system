{% extends "base.html" %}
{% block title %}Add Service{% endblock %}
{% block content %}
<div class="mb-3"><a href="{{ url_for('admin.services') }}" class="btn btn-outline-secondary btn-sm">← Back</a></div>
<div class="card mx-auto" style="max-width:500px;">
    <div class="card-header bg-primary text-white fw-bold">
        <i class="fas fa-plus-circle me-2"></i>Add New Service
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Service Name *</label>
                <input type="text" name="name" class="form-control" placeholder="e.g., Oil Change" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea name="description" class="form-control" rows="2" placeholder="Brief description..."></textarea>
            </div>
            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label fw-semibold">Price (₹) *</label>
                    <input type="number" name="price" class="form-control" placeholder="500" min="0" step="0.01" required>
                </div>
                <div class="col-6">
                    <label class="form-label fw-semibold">Duration (mins) *</label>
                    <input type="number" name="duration" class="form-control" placeholder="60" min="15" value="60" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-4 fw-bold">
                <i class="fas fa-save me-2"></i>Add Service
            </button>
        </form>
    </div>
</div>
{% endblock %}
