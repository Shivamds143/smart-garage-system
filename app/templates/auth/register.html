{% extends "base.html" %}
{% block title %}Register - Smart Garage Locator{% endblock %}
{% block fullcontent %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-4" style="background: linear-gradient(135deg,#1a73e8,#0d47a1);">
    <div class="card p-4" style="width:100%;max-width:520px;">
        <div class="text-center mb-3">
            <div class="display-4 mb-1">🔧</div>
            <h4 class="fw-bold text-primary">Create Account</h4>
        </div>
        <form method="POST" id="regForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Account Type</label>
                <div class="d-flex gap-3">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleUser" value="user" checked onchange="toggleGarage()">
                        <label class="form-check-label" for="roleUser"><i class="fas fa-user me-1"></i>Customer</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="roleAdmin" value="admin" onchange="toggleGarage()">
                        <label class="form-check-label" for="roleAdmin"><i class="fas fa-warehouse me-1"></i>Garage Owner</label>
                    </div>
                </div>
            </div>
            <div class="row g-2">
                <div class="col-12">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Your full name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="email@example.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Phone</label>
                    <input type="tel" name="phone" class="form-control" placeholder="+91 9876543210">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Min 6 chars" required minlength="6">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" id="confirm_pw" class="form-control" placeholder="Repeat password" required>
                </div>
            </div>
            <!-- Garage Fields -->
            <div id="garageFields" style="display:none;" class="mt-3 border-top pt-3">
                <h6 class="fw-bold text-primary"><i class="fas fa-warehouse me-2"></i>Garage Details</h6>
                <div class="row g-2">
                    <div class="col-12">
                        <label class="form-label">Garage Name</label>
                        <input type="text" name="garage_name" class="form-control" placeholder="ABC Auto Garage">
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Address</label>
                        <input type="text" name="garage_address" class="form-control" placeholder="Street address">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">City</label>
                        <input type="text" name="garage_city" class="form-control" placeholder="Mumbai">
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-3">
                <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
        </form>
        <div class="text-center mt-3">
            <span class="text-muted small">Already have an account?</span>
            <a href="{{ url_for('auth.login') }}" class="ms-1 fw-semibold">Sign in</a>
        </div>
    </div>
</div>
<script>
function toggleGarage() {
    document.getElementById('garageFields').style.display =
        document.getElementById('roleAdmin').checked ? 'block' : 'none';
}
document.getElementById('regForm').addEventListener('submit', function(e) {
    const pw = document.querySelector('[name=password]').value;
    const cpw = document.getElementById('confirm_pw').value;
    if (pw !== cpw) { e.preventDefault(); alert('Passwords do not match!'); }
});
</script>
{% endblock %}
